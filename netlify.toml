[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18.17.0"
  NEXT_PUBLIC_GA_ID = ""
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js Plugin for Build Caching
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Forms Configuration with Spam Filtering
[functions]
  directory = "netlify/functions"

# Enable Netlify's spam filtering
[[context.production.env]]
  NETLIFY_FORMS_SPAM_FILTER = "true"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/; connect-src 'self' https://www.google.com/recaptcha/api/siteverify"
